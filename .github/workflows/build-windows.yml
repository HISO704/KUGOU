name: Build Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build application
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name KugouToMP3 src\app.py
      - name: Include notices and optional FFmpeg
        shell: pwsh
        run: |
          if (Test-Path 'THIRD_PARTY_NOTICES.txt') {
            Copy-Item 'THIRD_PARTY_NOTICES.txt' 'dist/KugouToMP3/' -Force
          }
          if (Test-Path 'README_DISTRIBUTION.txt') {
            Copy-Item 'README_DISTRIBUTION.txt' 'dist/KugouToMP3/' -Force
          }
          if (Test-Path 'ffmpeg/bin/ffmpeg.exe') {
            New-Item -ItemType Directory -Force 'dist/KugouToMP3/ffmpeg/bin' | Out-Null
            Copy-Item 'ffmpeg/bin/ffmpeg.exe' 'dist/KugouToMP3/ffmpeg/bin/' -Force
          }
          if (Test-Path 'ffmpeg/bin/ffprobe.exe') {
            New-Item -ItemType Directory -Force 'dist/KugouToMP3/ffmpeg/bin' | Out-Null
            Copy-Item 'ffmpeg/bin/ffprobe.exe' 'dist/KugouToMP3/ffmpeg/bin/' -Force
          }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/KugouToMP3/*' -DestinationPath 'dist/KugouToMP3_Portable_Windows.zip' -Force
      - name: Upload EXE folder and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KugouToMP3-Windows-Portable
          path: |
            dist/KugouToMP3/**
            dist/KugouToMP3_Portable_Windows.zip
          if-no-files-found: error
          retention-days: 14
